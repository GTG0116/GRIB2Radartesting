name: Update Radar Data

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: radar-update
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.12'
          channels: conda-forge
          channel-priority: strict
          activate-environment: radar-env

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -c conda-forge arm_pyart cartopy matplotlib numpy scipy shapely boto3 pygrib

      - name: Run radar update script
        shell: bash -l {0}
        run: python update_radar.py
        continue-on-error: false

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add docs/assets/*.png docs/assets/bounds.js docs/assets/frames.js docs/assets/manifest.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m 'Update radar images and bounds'
          git pull --rebase origin ${{ github.ref_name }}
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
