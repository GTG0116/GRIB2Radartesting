name: Update Radar Data

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:  # Allows manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.12'
          channels: conda-forge
          channel-priority: strict
          activate-environment: radar-env

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -c conda-forge arm_pyart cartopy matplotlib numpy scipy shapely boto3

      - name: Run radar update script
        shell: bash -l {0}
        run: python update_radar.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add docs/assets/*
          git commit -m 'Update radar images and bounds' || echo "No changes to commit"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
