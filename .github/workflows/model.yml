name: Update Model Data

on:
  schedule:
    - cron: '45 * * * *'   # Run at :45 past every hour (HRRR posts ~:40-:50 past)
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  pages: write

jobs:
  update-model:
    runs-on: ubuntu-latest
    concurrency:
      group: model-update
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.12'
          channels: conda-forge
          channel-priority: strict
          activate-environment: model-env

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          conda install -c conda-forge \
            cfgrib eccodes xarray numpy matplotlib cartopy requests

      - name: Run model update script
        shell: bash -l {0}
        run: python update_model.py
        continue-on-error: false

      - name: Commit and push model data
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add docs/assets/model_bounds.js \
                  docs/assets/model_frames.js \
                  docs/assets/model_manifest.json \
                  "docs/assets/HRRR_precip_type*.png" \
                  "docs/assets/NAM3k_precip_type*.png" || true
          git diff --cached --quiet && echo "No model changes to commit" && exit 0
          git commit -m 'Update HRRR/NAM3k precipitation type data'
          git pull --rebase origin ${{ github.ref_name }}
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
